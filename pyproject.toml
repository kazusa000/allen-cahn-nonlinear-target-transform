[project]
name = "allen-cahn-nonlinear-target-transform"
version = "0.1.0"
description = "Joint training of nonlinear target dynamics, observer injection, and conditionally invertible error transformations."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
design = [
  "cvxpy>=1.6",
]
gpu = [
  "torch>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
